# One command: docker compose up --build   (then open http://localhost:8080)
#
# Models: pick one on the app's Settings page.
#   - Gemini (cloud, fast): paste an API key in Settings. Nothing else to install.
#   - Local Ollama is disabled by default for server-friendly deployments. To opt in:
#       a) Ollama already running: ENABLE_OLLAMA=true docker compose up --build
#       b) Ollama in Docker: ENABLE_OLLAMA=true OLLAMA_URL=http://ollama:11434 docker compose --profile local-llm up --build
#          docker compose exec ollama ollama pull mistral:7b && docker compose exec ollama ollama pull nomic-embed-text
#
# Voice mode (optional): INSTALL_VOICE=1 docker compose up --build, then once:
#   docker compose exec backend python scripts/download_voice.py     (about 200 MB, kept in the data volume)
services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_VOICE: ${INSTALL_VOICE:-0}   # 1 adds local voice mode: INSTALL_VOICE=1 docker compose up --build
    # backend/.env (git-ignored) supplies AIA_GEMINI_API_KEY and friends; the file is optional
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      AIA_ENABLE_OLLAMA: ${ENABLE_OLLAMA:-false}
      AIA_OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      AIA_ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}        # set to false once your accounts exist
      AIA_COOKIE_SECURE: ${COOKIE_SECURE:-false}     # set to true when serving over HTTPS
      AIA_CODE_RUNNER_URL: ${CODE_RUNNER_URL:-}
      AIA_CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-data:/srv/data
      - app-uploads:/srv/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  python-sandbox:
    profiles: ["code-runner"]
    build: ./runner/sandbox
    image: aia-python-sandbox:3.12
    network_mode: none
    entrypoint: ["true"]
    restart: "no"

  code-runner:
    profiles: ["code-runner"]
    build: ./runner
    environment:
      RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:-}
      RUNNER_RUNTIME: ${CODE_RUNNER_RUNTIME:-runsc}
      RUNNER_IMAGE: aia-python-sandbox:3.12
      RUNNER_CONCURRENCY: ${CODE_RUNNER_CONCURRENCY:-2}
    depends_on:
      python-sandbox:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    expose: ["8081"]
    restart: unless-stopped

volumes:
  app-data:
  app-uploads:
  ollama-models:
