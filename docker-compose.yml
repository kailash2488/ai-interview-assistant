# One command: docker compose up --build   (then open http://localhost:8080)
#
# Models: pick one on the app's Settings page.
#   - Gemini (cloud, fast): paste an API key in Settings. Nothing else to install.
#   - Local Ollama (free, private, slow on CPU), either:
#       a) Ollama already running on this computer: nothing to do, the backend reaches it via host.docker.internal.
#       b) Ollama in Docker:  OLLAMA_URL=http://ollama:11434 docker compose --profile local-llm up --build
#          docker compose exec ollama ollama pull mistral:7b && docker compose exec ollama ollama pull nomic-embed-text
#
# Voice mode (optional): INSTALL_VOICE=1 docker compose up --build, then once:
#   docker compose exec backend python scripts/download_voice.py     (about 200 MB, kept in the data volume)
services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_VOICE: ${INSTALL_VOICE:-0}   # 1 adds local voice mode: INSTALL_VOICE=1 docker compose up --build
    # backend/.env (git-ignored) supplies AIA_GEMINI_API_KEY and friends; the file is optional
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      AIA_OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      AIA_ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}        # set to false once your accounts exist
      AIA_COOKIE_SECURE: ${COOKIE_SECURE:-false}     # set to true when serving over HTTPS
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-data:/srv/data
      - app-uploads:/srv/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  app-data:
  app-uploads:
  ollama-models:
