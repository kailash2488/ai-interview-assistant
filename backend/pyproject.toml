[project]
name = "ai-interview-assistant-backend"
version = "0.1.0"
description = "Backend for the AI Interview Assistant"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "pymupdf",
    "pdfplumber",
    "python-docx",
    "python-multipart",
    "httpx",
    "qdrant-client",
    "langchain-text-splitters",
    "cryptography",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
