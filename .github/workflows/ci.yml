name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aia
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: aia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aia -d aia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIA_TEST_POSTGRES_URL: postgresql+psycopg://aia:test-only-password@127.0.0.1:5432/aia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e "backend[dev]"
      - run: pytest -q backend/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --maxWorkers=1
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
